  <!-- Start-Intro am Handy (installierte App) -->
  <style>
    #intro { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(circle at 50% 46%, rgba(139,92,246,.30), rgba(139,92,246,.08) 38%, transparent 62%), #0E0B16; transition: opacity .38s ease, visibility .38s; }
    html.intro #intro { display: flex; }
    #intro .ii { width: 30vw; max-width: 150px; aspect-ratio: 1; animation: introPop .7s cubic-bezier(.2,.9,.25,1.15) both; filter: drop-shadow(0 0 28px rgba(139,92,246,.55)); }
    #intro .ii svg { width: 100%; height: 100%; display: block; }
    #intro .in { font: 700 clamp(26px, 7.5vw, 34px) 'Space Grotesk', Inter, system-ui, sans-serif; letter-spacing: -.02em; color: #EDE9FE; animation: introUp .6s .18s ease both; }
    #intro .bk { transform-box: fill-box; }
    #intro .bk { transform-origin: 50% 100%; animation: introBook .5s cubic-bezier(.2,.9,.3,1.2) both; }
    #intro .bk:nth-child(2) { animation-delay: .22s } #intro .bk:nth-child(3) { animation-delay: .3s }
    #intro.out { opacity: 0; visibility: hidden; }
    @keyframes introPop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
    @keyframes introUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes introBook { from { transform: scaleY(0); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { #intro * { animation: none !important; } }
  </style>
  <script>
    (function () {
      try {
        var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        var phone = matchMedia('(max-width: 820px)').matches;
        if (standalone && phone && !sessionStorage.getItem('nightshelf.intro')) {
          sessionStorage.setItem('nightshelf.intro', '1');
          document.documentElement.classList.add('intro');
        }
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      if (!document.documentElement.classList.contains('intro')) return;
      var el = document.getElementById('intro'), done = false;
      function hide() { if (done) return; done = true; el.classList.add('out'); setTimeout(function () { document.documentElement.classList.remove('intro'); }, 420); }
      el.addEventListener('click', hide);
      setTimeout(hide, 1300);
    })();
  </script>
